# Release Flutter SDK — [SMV-1723] 배포의 시작 버튼. 사람이 하는 일은 이 버튼과 열린 PR 의 머지뿐이다.
#
#   버튼(version) ─▶ 버전 올리기 PR(release-flutter/<V> → main | release/v1) ─▶ PR build(workflow_dispatch)
#   (사람) 머지 ─▶ release-flutter-on-merge.yml: 머지 커밋에 태그 <V> ─▶ publish-flutter-sdk.yml(ref = 태그 <V>)
#                                                                      : pub.dev 발행 ─▶ GitHub Release <V>
#
# 라인은 버전 major 가 정한다 — 3.x 는 main(패키지 3개), 1.x 는 release/v1(shoplive_player 하나 · 없으면 마지막 1.x 태그에서 만든다).
# 바탕 네이티브 SDK(native_version, 비우면 version)가 먼저 공개돼 있어야 한다(Android maven-repo POM · iOS Release/Package.swift 또는
# pod-specs · 네이티브 Release 노트). pubspec·태그·Release 는 version, Android 좌표·podspec SDK 버전·sha256·CHANGELOG 링크는 native_version.
# CHANGELOG(pub.dev 에 나감)는 영어 고정 문구 + 네이티브 Release 링크만 — 직전 태그 이후 커밋 제목은 PR 본문에만 둔다.
# 이미 태그·pub.dev 에 있는 버전이면 멈춘다 — pub.dev 는 같은 버전을 다시 올릴 수 없다.
# 같은 버전의 PR 이 열려 있으면 새로 만들지 않고 PR build 만 다시 부른다.
#
# 쓰는 토큰은 내장 GITHUB_TOKEN 뿐이다. 그 토큰이 연 PR 은 pull_request 워크플로를 바로 깨우지 않으므로(승인 대기이거나 안 돎)
# PR build 는 이 워크플로가 workflow_dispatch 로 그 브랜치에 부른다(GITHUB_TOKEN 의 workflow_dispatch 는 돈다).
# 로직은 scripts/release-flutter-prepare.sh 에 있다. 운영 방법: RELEASING.md
name: Release Flutter SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스할 버전 — 접두사 없는 x.y.z (예: 3.0.4 · 1.9.1). 3.x=main · 1.x=release/v1. 네이티브 같은 버전이 먼저 공개돼 있어야 합니다."
        required: true
        type: string
      native_version:
        description: "네이티브 SDK 버전 — 비우면 version 과 같음. Flutter 만 고친 릴리스일 때 그 바탕 SDK (예: version 1.9.1 · native_version 1.9.0). 메이저가 같아야 합니다."
        required: false
        default: ""
        type: string

# 같은 버전을 두 번 누르면 브랜치 push 와 PR 생성이 겹친다 — 취소하지 않고 줄 세운다.
concurrency:
  group: release-flutter-sdk-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: prepare (${{ inputs.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # release-flutter/<V> push · release/v1 생성(git/refs)
      pull-requests: write   # PR 생성
      actions: write         # PR build 를 workflow_dispatch 로 부른다
    steps:
      # CHANGELOG 범위(직전 태그 이후)와 기준 브랜치를 읽으려면 전체 이력·태그가 필요하다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NATIVE_VERSION: ${{ inputs.native_version }}
        run: bash scripts/release-flutter-prepare.sh "$VERSION" "$NATIVE_VERSION"
