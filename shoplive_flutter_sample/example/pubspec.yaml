name: shoplive_player_example
description: Demonstrates how to use the shoplive_core / shoplive_player / shoplive_streamer plugins.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shoplive_player:
    path: ../
  shoplive_core:
    path: ../../shoplive_core
  shoplive_streamer:
    path: ../../shoplive_streamer
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# The plugins depend on hosted shoplive_core 3.0.3; resolve it from the local checkout here.
dependency_overrides:
  shoplive_core:
    path: ../../shoplive_core
