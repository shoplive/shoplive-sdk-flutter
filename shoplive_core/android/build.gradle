group = "cloud.shoplive.shoplive_core"
version = "3.0.3"

buildscript {
    // 버전 정합: Kotlin 1.9.25 = shoplive-*-3.0.3 POM의 kotlin-stdlib 버전 (DRAFT-flutter-sdk-302-android S11, SMV-1749 재확인)
    ext.kotlin_version = "1.9.25"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// cloud.shoplive 그룹은 Shoplive 저장소에서만 받는다: SDK 3.0.3 artifact는 Maven Central에 없다(sdk.shoplive.cloud만 제공 — SMV-1749 확인).
// 3.0.2의 shoplive-media3 좌표 충돌(Central판 1.10.1.2와 내용 불일치)은 3.0.3에서 사라졌다 — player-sdk 3.0.3은 androidx.media3를 직접 의존.
// 가드는 이제 cloud.shoplive 그룹을 Shoplive 저장소로 고정하는 역할만 한다(Central에 같은 그룹 좌표가 다시 생겨도 섞이지 않게).
// exclusiveContent는 같은 그룹에 한 번만 선언해야 하므로(중복 시 해석 실패) 3개 플러그인·호스트 앱 중 먼저 선언한 쪽만 적용한다.
// 값이 true일 때만 "이미 구성됨"으로 본다(ext 또는 gradle.properties; "false"/미지정이면 플러그인이 선언)
def shopliveRepoAlreadyConfigured = rootProject.findProperty("shopliveMavenRepoConfigured")?.toString()?.toBoolean() ?: false
if (!shopliveRepoAlreadyConfigured) {
    rootProject.ext.shopliveMavenRepoConfigured = true
    rootProject.allprojects {
        repositories {
            google()
            mavenCentral()
            exclusiveContent {
                forRepository { maven { url "https://sdk.shoplive.cloud/maven-repo" } }
                filter { includeGroup "cloud.shoplive" }
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "cloud.shoplive.shoplive_core"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
        // SDK AAR consumer rules 보완(kotlinx.parcelize.Parcelize Missing class) — consumer-rules.pro 참고
        consumerProguardFiles "consumer-rules.pro"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // FIXME(SDP-VERIFY): 요확인 — shoplive_core/player/streamer 3플러그인의 Shoplive SDK 버전은 같은 값(3.0.3)으로 맞춰야 함. 어긋나면 Gradle이 가장 높은 shoplive-core를 골라 바이너리가 어긋날 수 있음. 완화책(strictly/BOM)은 미결 · 근거 DRAFT-flutter-sdk-302-android/PKG-01 · 자동 통과 금지(:app:dependencies 확인)
    implementation("cloud.shoplive:shoplive-core:3.0.3")
    // core·player SDK 레이아웃이 ConstraintLayout을 쓰는데, SDK가 의존하는 material:1.9.0은 constraintlayout 2.0.1을 끌어온다.
    // 2.0.1 solver는 in-app PIP 전환 시 onMeasure에서 ClassCastException(ArrayLinkedVariables→SolverVariableValues)을 낸다.
    // Flutter 앱은 constraintlayout을 직접 선언하지 않아 2.0.1이 그대로 남으므로, 항상 포함되는 core 플러그인에서 끌어올린다.
    // SDK는 레이아웃 XML과 ConstraintLayout 위젯 상속(RtcPlayerView)으로만 쓰고 solver 패키지는 참조하지 않는다 → 2.x 안의 2.2.1 상향(위젯 API 하위 호환).
    // TODO(SDP-VERIFY): SDK POM이 constraintlayout 2.1+를 직접 선언하면 제거 · 근거 DRAFT-flutter-sdk-302-android/REL-02
    implementation("androidx.constraintlayout:constraintlayout:2.2.1")

    testImplementation("junit:junit:4.13.2")
}
