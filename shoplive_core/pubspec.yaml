name: shoplive_core
description: Shoplive core plugin for Flutter (initialize, user, conversion) on Shoplive SDK 3.x. To use Shoplive, please contact ask@shoplive.cloud.
version: 3.0.3
homepage: https://github.com/shoplive/flutter-sdk-sample/tree/main/shoplive_core

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cloud.shoplive.shoplive_core
        pluginClass: ShopliveCorePlugin
      ios:
        pluginClass: ShopliveCorePlugin
